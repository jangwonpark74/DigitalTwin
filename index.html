<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#ffffff"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <title>Atlas RAN Twin — 5G Site & Radio Environment Studio</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="ran.css"/>
  <link rel="stylesheet" href="usecases.css"/>
  <link rel="stylesheet" href="light.css"/>
  <link rel="stylesheet" href="ops.css"/>
  <link rel="stylesheet" href="dm.css"/>
  <link rel="stylesheet" href="hardware-workspace.css"/>
  <link rel="stylesheet" href="workspace.css"/>
  <link rel="stylesheet" href="radio.css"/>
  <link rel="stylesheet" href="scene.css"/>
  <link rel="stylesheet" href="node_modules/cesium/Build/Cesium/Widgets/widgets.css"/>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand"><span class="brand-mark">✦</span><div><strong>ATLAS<span>RAN</span></strong><small>DIGITAL TWIN STUDIO</small></div></div>
      <button type="button" class="workspace-switch" data-go="projects" aria-label="Manage Twin Workspace projects">
        <span class="workspace-icon" aria-hidden="true">◈</span>
        <span class="workspace-switch-copy"><strong id="workspace-project-name">RAN Twin · City Pilot</strong><small id="workspace-project-context">Example City · Central cluster</small></span>
        <span class="workspace-switch-arrow" aria-hidden="true">⌄</span>
      </button>
      <nav id="navigation" aria-label="Application workspaces">
        <section class="nav-group">
          <button class="nav-group-toggle" data-group-toggle="twin" aria-controls="nav-twin" aria-expanded="true">WORKSPACE <span aria-hidden="true">⌄</span></button>
          <div id="nav-twin" class="nav-group-items">
            <button data-view="overview" class="nav-item active"><span class="nav-symbol">▦</span> Mission control</button>
            <button data-view="projects" class="nav-item"><span class="nav-symbol">◈</span> Projects</button>
            <button data-view="artifacts" class="nav-item"><span class="nav-symbol">▤</span> Project artifacts</button>
            <button data-view="map" class="nav-item"><span class="nav-symbol">⌖</span> City map &amp; sites</button>
            <button data-view="stack" class="nav-item"><span class="nav-symbol">⬡</span> RAN architecture</button>
            <button data-view="planner" class="nav-item"><span class="nav-symbol">▤</span> Site &amp; cell planner</button>
            <button data-view="radio" class="nav-item"><span class="nav-symbol">⌁</span> Radio planner</button>
          </div>
        </section>
        <section class="nav-group">
          <button class="nav-group-toggle" data-group-toggle="configuration" aria-controls="nav-configuration" aria-expanded="false">CONFIGURATION <span aria-hidden="true">⌄</span></button>
          <div id="nav-configuration" class="nav-group-items" hidden>
            <button data-view="ray" class="nav-item"><span class="nav-symbol">◇</span> Ray-tracing lab</button>
            <button data-view="ues" class="nav-item"><span class="nav-symbol">◎</span> Virtual UE fleet</button>
          </div>
        </section>
        <section class="nav-group">
          <button class="nav-group-toggle" data-group-toggle="usecases" aria-controls="nav-usecases" aria-expanded="false">USE CASES <span aria-hidden="true">⌄</span></button>
          <div id="nav-usecases" class="nav-group-items" hidden>
            <button data-view="drive" class="nav-item"><span class="nav-symbol">⌁</span> Virtual drive test</button>
            <button data-view="ab" class="nav-item"><span class="nav-symbol">⇄</span> Package A/B test</button>
            <button data-view="data" class="nav-item"><span class="nav-symbol">▥</span> AI-RAN data gen</button>
          </div>
        </section>
        <section class="nav-group">
          <button class="nav-group-toggle" data-group-toggle="tasks" aria-controls="nav-tasks" aria-expanded="false">TASKS &amp; SCHEDULE <span aria-hidden="true">⌄</span></button>
          <div id="nav-tasks" class="nav-group-items" hidden>
            <button data-view="tasks" class="nav-item"><span class="nav-symbol">☷</span> Task board</button>
            <button data-view="schedule" class="nav-item"><span class="nav-symbol">▦</span> Schedule</button>
          </div>
        </section>
        <section class="nav-group">
          <button class="nav-group-toggle" data-group-toggle="management" aria-controls="nav-management"
            aria-expanded="false"> SYSTEM <span aria-hidden="true">⌄</span></button>
          <div id="nav-management" class="nav-group-items" hidden>
            <button data-view="hardware" class="nav-item"><span class="nav-symbol">▣</span> H/W inventory</button>
            <button data-view="software" class="nav-item"><span class="nav-symbol">▤</span> Software management</button>
            <button data-view="monitoring" class="nav-item"><span class="nav-symbol">◉</span> Monitoring</button>
          </div>
        </section>
        <button data-view="activity" class="nav-item nav-activity"><span class="nav-symbol">≡</span> Activity <span id="event-count" class="nav-counter">0</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="side-pulse"><span class="pulse-dot amber"></span><div><strong>Preparation mode</strong><small>RAN endpoints not connected</small></div></div><div class="sidebar-footer">ATLAS RAN <span>CONCEPT v0.2</span></div></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb">Digital Twin <span>/</span> 5G RAN <span>/</span> <strong id="crumb-view">Mission control</strong></div><div class="top-actions"><span class="mode-label"><span class="mode-dot"></span> PLANNING MOCKUP</span><button id="import-btn" class="button outline">↥ Import manifest</button><button id="export-btn" class="button outline">⇩ Export manifest</button><input type="file" id="manifest-file" accept="application/json,.json" hidden/></div></header>
      <main id="content" tabindex="-1"></main>
      <footer class="statusbar"><span>◉&nbsp; 5G RAN TWIN <b id="engine-status">PREPARATION</b></span><span id="foot-counts">3 SITES · 9 CELLS · 1,200 VIRTUAL UES</span><span>MAP · ILLUSTRATIVE METRICS </span></footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>window.CESIUM_BASE_URL = '/node_modules/cesium/Build/Cesium/';</script>
  <script defer src="node_modules/cesium/Build/Cesium/Cesium.js"></script>
  <script type="module" src="app.mjs"></script>
</body>
</html>
